name: Build Android AAB (Google Play Bundle)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies & Build PWA
        run: |
          npm ci || npm install
          npm run build

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          sudo ln -s /usr/local/lib/android/sdk/cmdline-tools/latest /usr/local/lib/android/sdk/tools 2>/dev/null || true

      - name: Generate Android Signing Keystore
        run: |
          rm -f android.keystore
          keytool -genkey -v -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass androidpassword -keypass androidpassword \
            -dname "CN=ScreenMegaphone, OU=App, O=Megaphone, L=Taipei, S=Taiwan, C=TW"

      - name: Build Android Project with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: List Generated Artifacts
        run: |
          echo "=== 產出的 Android 安裝檔清單 ==="
          find app/build/outputs -name "*.aab" -o -name "*.apk" || find . -name "*.aab" -o -name "*.apk"

      - name: Upload AAB (Google Play Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-megaphone-google-play-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            android.keystore
          retention-days: 30

      - name: Upload APK (Direct Phone Install) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-megaphone-phone-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
