name: Build Android AAB (Google Play Bundle)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies & Build PWA
        run: |
          npm ci || npm install
          npm run build

      - name: Configure Pre-installed Android SDK and Bubblewrap
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          
          # 自動同意 Android 授權協議
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 自動生成 Bubblewrap 雲端設定檔
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Install Google Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Generate Android Signing Keystore
        run: |
          keytool -genkey -v -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass androidpassword -keypass androidpassword \
            -dname "CN=ScreenMegaphone, OU=App, O=Megaphone, L=Taipei, S=Taiwan, C=TW"

      - name: Build Android Project & Generate AAB Bundle
        run: |
          bubblewrap build --skipPwaValidation --keyStorePath ./android.keystore --keyStorePassword androidpassword --keyPassword androidpassword || \
          bubblewrap build --skipPwaValidation || true

      - name: List Generated Artifacts
        run: |
          echo "=== 產出的 Android 安裝檔清單 ==="
          find . -name "*.aab" -o -name "*.apk"

      - name: Upload AAB (Google Play Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-megaphone-google-play-aab
          path: |
            **/*.aab
            android.keystore
          retention-days: 30

      - name: Upload APK (Direct Phone Install) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-megaphone-phone-apk
          path: |
            **/*.apk
          retention-days: 30
