name: Build Android AAB (Google Play Bundle)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies & Build PWA
        run: |
          npm ci || npm install
          npm run build

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          sudo ln -s /usr/local/lib/android/sdk/cmdline-tools/latest /usr/local/lib/android/sdk/tools 2>/dev/null || true

      - name: Prepare Upload Signing Key from Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore"
              echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "使用 GitHub Secrets 中的上傳金鑰"
          else
            echo "::error::未設定 SIGNING_KEYSTORE_BASE64 等 GitHub Secrets，無法簽署上傳金鑰，停止建置"
            exit 1
          fi

      - name: Build Android Project with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Show Signing Certificate Fingerprint
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "=== AAB 簽署憑證（核對 Play Console 的上傳金鑰 SHA-256）==="
          keytool -printcert -jarfile "$AAB" | grep -E "SHA256|Owner"

      - name: List Generated Artifacts
        run: |
          echo "=== 產出的 Android 安裝檔清單 ==="
          find app/build/outputs -name "*.aab" -o -name "*.apk" || find . -name "*.aab" -o -name "*.apk"

      - name: Upload AAB (Google Play Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-megaphone-google-play-aab
          path: |
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK (Direct Phone Install) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-megaphone-phone-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
