// 螢幕大聲公 Android 外殼：單一 WebView Activity，載入 app/src/main/assets/web/（由 npm run build 產生）。
// 原本是 Bubblewrap 產生的 TWA 專案，TWA 相關設定與 androidbrowserhelper 已移除（App 沒有用到）。
// applicationId 與簽署方式不可更改；版本號要與 twa-manifest.json 同步。

plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace "com.screenmegaphone.ledbanner"
    defaultConfig {
        applicationId "com.screenmegaphone.ledbanner"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 15
        versionName "1.0.9"

        // App 名稱（設定、應用程式資訊）與桌面圖示下的名稱
        resValue "string", "appName", "螢幕大聲公 - LED 手持彈幕"
        resValue "string", "launcherName", "螢幕大聲公"
    }
    signingConfigs {
        release {
            // 上傳金鑰只從環境變數讀取（CI 由 GitHub Secrets 解出，見 .github/workflows/build-android-aab.yml）。
            // repo 內不放任何金鑰或密碼。沒有設定時 release 版不簽署，Play 會拒收。
            def envKeystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
            if (envKeystorePath && file(envKeystorePath).exists()) {
                storeFile file(envKeystorePath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
